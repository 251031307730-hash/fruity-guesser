<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruity Guesser+</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0e3b2f;color:#222}
.wrap{max-width:900px;margin:auto;background:#fff9eb;min-height:100vh;padding:22px}
h1{text-align:center;margin:8px 0;color:#7b4bd4}.sub{text-align:center;color:#666}
.card{background:white;border:1px solid #ead8b6;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #0001}
label{display:block;font-weight:700;margin:12px 0 6px}
input,textarea,select{width:100%;padding:13px;border:2px solid #e6d2ae;border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#7650d9;color:white;font-size:17px}.secondary{background:#eee}.danger{background:#d9534f;color:white}
.hidden{display:none}.status{padding:12px;background:#eef3ff;border-radius:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.letter{background:#f2e7ff;border:2px solid #c9a8ff;padding:12px;border-radius:10px;font-weight:700}
.wordbox{font-size:30px;letter-spacing:8px;text-align:center;margin:20px 0;min-height:50px}
.info{text-align:center}.meaning{font-size:20px;color:#5c3c9c;font-weight:700}.example{color:#555;font-style:italic}
.badge{display:inline-block;padding:6px 10px;background:#f1df9c;border-radius:20px;margin:3px}
.wrong{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🍉 Fruity Guesser+</h1>
<div class="sub">Game học từ vựng tiếng Anh bằng cách xếp chữ</div>

<section id="home" class="card">
<h2>🤖 Tạo chủ đề bằng AI</h2>
<p>AI sẽ tìm thông tin trên web rồi tạo 30 từ vựng theo 5 cấp độ.</p>

<label>Chủ đề muốn học</label>
<input id="topic" placeholder="Ví dụ: Du lịch Nhật Bản, AI, bóng đá, cà phê Việt Nam...">

<label>Mục tiêu / đối tượng</label>
<textarea id="audience" rows="3" placeholder="Ví dụ: tiếng Anh giao tiếp cho sinh viên, ưu tiên từ thông dụng..."></textarea>

<label>Độ khó</label>
<select id="difficulty">
<option>Từ dễ → khó</option>
<option>Chủ yếu cơ bản</option>
<option>Trung cấp → nâng cao</option>
<option>Nâng cao</option>
</select>

<button class="primary" id="generate">🔎 Tìm web + 🤖 Tạo 30 từ</button>
<div id="status" class="status">Sẵn sàng.</div>
</section>

<section id="game" class="card hidden">
<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
<span class="badge" id="level"></span><span class="badge" id="progress"></span><span class="badge">⏱️ <b id="timer">30</b></span>
</div>
<div class="wordbox" id="wordbox"></div>
<div class="grid" id="letters"></div>
<div class="info">
<p class="meaning" id="meaning"></p>
<p class="example" id="example"></p>
</div>
<button class="secondary" id="skip">Bỏ qua</button>
<button class="secondary" id="back">Về trang chủ</button>
</section>

<section class="card">
<h2>📕 Sổ từ vựng làm sai</h2>
<div id="wrongList">Chưa có từ sai.</div>
<button class="secondary" id="clearWrong">Xóa sổ từ sai</button>
</section>
</div>

<script>
const AI_API_URL = "PASTE_YOUR_WORKER_URL_HERE";

const baseWords = [
["apple","🍎"],["banana","🍌"],["orange","🍊"],["grape","🍇"],["watermelon","🍉"],["mango","🥭"],
["pineapple","🍍"],["strawberry","🍓"],["lemon","🍋"],["kiwi","🥝"],["peach","🍑"],["cherry","🍒"],
["strategy","chiến lược"],["customer","khách hàng"],["market","thị trường"],["brand","thương hiệu"],["sales","doanh số"],["campaign","chiến dịch"],
["revenue","doanh thu"],["profit","lợi nhuận"],["manager","quản lý"],["leadership","lãnh đạo"],["budget","ngân sách"],["investment","đầu tư"],
["business","kinh doanh"],["company","công ty"],["employee","nhân viên"],["meeting","cuộc họp"],["project","dự án"],["deadline","hạn chót"]
];

let words=[], index=0, seconds=30, timer=null, selected=[];
const wrongKey="fruity_guesser_wrong_v2";

function adaptBase(){
 return baseWords.map((x,i)=>({word:x[0],meaning:x[1],example:`This is an example of ${x[0]}.`,image_query:x[0],level:Math.floor(i/6)+1}));
}
function saveWrong(w){
 const a=JSON.parse(localStorage.getItem(wrongKey)||"[]");
 const k=w.word.toLowerCase();
 const old=a.find(x=>x.word.toLowerCase()===k);
 if(old) old.count=(old.count||1)+1;
 else a.push({word:w.word,meaning:w.meaning,example:w.example,count:1});
 a.sort((x,y)=>(y.count||0)-(x.count||0));
 localStorage.setItem(wrongKey,JSON.stringify(a.slice(0,200)));
 renderWrong();
}
function renderWrong(){
 const el=document.getElementById("wrongList"), a=JSON.parse(localStorage.getItem(wrongKey)||"[]");
 if(!a.length){el.textContent="Chưa có từ sai.";return}
 el.innerHTML=a.map(x=>`<div class="wrong"><span><b>${esc(x.word)}</b> — ${esc(x.meaning||"")}</span><span>❌ ${x.count||1}</span></div>`).join("");
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function current(){return words[index]}

function start(){
 document.getElementById("home").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 index=0; show();
}
function show(){
 if(index>=words.length){finish();return}
 const w=current();
 document.getElementById("level").textContent="Cấp "+(w.level||Math.floor(index/6)+1);
 document.getElementById("progress").textContent=(index+1)+"/"+words.length;
 document.getElementById("wordbox").textContent=w.emoji||"🔤";
 document.getElementById("meaning").textContent=w.meaning||"";
 document.getElementById("example").textContent=w.example||"";
 const letters=(w.word||"").toUpperCase().split("");
 selected=[];
 document.getElementById("letters").innerHTML="";
 shuffle(letters).forEach((ch,i)=>{
   const b=document.createElement("button");b.className="letter";b.textContent=ch;b.onclick=()=>pick(ch,b);
   document.getElementById("letters").appendChild(b);
 });
 seconds=30;document.getElementById("timer").textContent=seconds;
 clearInterval(timer);timer=setInterval(()=>{seconds--;document.getElementById("timer").textContent=seconds;if(seconds<=0){clearInterval(timer);wrongAndNext()}},1000);
}
function pick(ch,b){
 selected.push(ch);b.disabled=true;
 document.getElementById("wordbox").textContent=selected.join("");
 if(selected.length===(current().word||"").length){
   clearInterval(timer);
   if(selected.join("").toLowerCase()==current().word.toLowerCase()) next();
   else wrongAndNext();
 }
}
function next(){index++;show()}
function wrongAndNext(){saveWrong(current());setTimeout(()=>next(),400)}
function finish(){
 clearInterval(timer);document.getElementById("wordbox").textContent="🎉 Hoàn thành!";
 document.getElementById("letters").innerHTML="";
 document.getElementById("meaning").textContent="Bạn đã hoàn thành chủ đề.";
}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
document.getElementById("skip").onclick=wrongAndNext;
document.getElementById("back").onclick=()=>{clearInterval(timer);document.getElementById("game").classList.add("hidden");document.getElementById("home").classList.remove("hidden")};
document.getElementById("clearWrong").onclick=()=>{localStorage.removeItem(wrongKey);renderWrong()};

document.getElementById("generate").onclick=async()=>{
 const topic=document.getElementById("topic").value.trim();
 const audience=document.getElementById("audience").value.trim();
 const difficulty=document.getElementById("difficulty").value;
 const status=document.getElementById("status");
 if(!topic){status.textContent="⚠️ Hãy nhập chủ đề.";return}
 if(!AI_API_URL || AI_API_URL.includes("PASTE_YOUR")){status.textContent="⚠️ Bạn chưa cấu hình URL Cloudflare Worker trong index.html.";return}
 status.textContent="🔎 AI đang tìm web và tạo 30 từ...";
 document.getElementById("generate").disabled=true;
 try{
   const r=await fetch(AI_API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,audience,difficulty})});
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||"Worker lỗi");
   if(!data.words||data.words.length<30) throw new Error("AI chưa tạo đủ 30 từ.");
   words=data.words.map((w,i)=>({...w,level:Math.floor(i/6)+1}));
   status.textContent="✅ Đã tạo 30 từ. Bắt đầu chơi!";
   start();
 }catch(e){status.textContent="❌ "+e.message}
 finally{document.getElementById("generate").disabled=false}
};
words=adaptBase();
renderWrong();
</script>
</body>
</html>
